<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#0e1822"/>
  
  <!-- Globe base circle -->
  <circle cx="32" cy="36" r="22" fill="#0d2040" stroke="#4a9de0" stroke-width="1.5"/>
  
  <!-- Latitude lines -->
  <ellipse cx="32" cy="36" rx="22" ry="7" fill="none" stroke="#1e3a5a" stroke-width="1"/>
  <ellipse cx="32" cy="28" rx="19" ry="4" fill="none" stroke="#1e3a5a" stroke-width="0.8"/>
  <ellipse cx="32" cy="44" rx="19" ry="4" fill="none" stroke="#1e3a5a" stroke-width="0.8"/>
  
  <!-- Longitude line -->
  <line x1="32" y1="14" x2="32" y2="58" stroke="#1e3a5a" stroke-width="0.8"/>
  
  <!-- Signal arc over globe -->
  <path d="M13 39 Q32 10 51 39" fill="none" stroke="#f0c040" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Station dots -->
  <circle cx="13" cy="39" r="3" fill="#f0c040"/>
  <circle cx="51" cy="39" r="3" fill="#4de090"/>
</svg>
